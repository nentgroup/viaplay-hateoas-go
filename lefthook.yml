---
# For more configuration options, see: https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  jobs:
    - name: golangci-lint
      glob: "*.go"
      run: golangci-lint run --allow-parallel-runners --fix
    - name: github-actions-lint
      run: actionlint
      glob: ".github/workflows/*.yml"


pre-push:
  parallel: true
  jobs:
    - name: test
      run: go test -v ./... -covermode=count -coverpkg=github.com/nentgroup/viaplay-hateoas-go

commit-msg:
  jobs:
    - name: commitlint
      run: commitlint lint {1}
      fail_text: |
        ❌ Invalid commit message format!
        Please follow Conventional Commits:
          feat(scope): add feature
          fix(scope): fix bug
        Example:
          feat(auth): add JWT support
        See https://www.conventionalcommits.org/en/v1.0.0/

...